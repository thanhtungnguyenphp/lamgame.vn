name: Backup Database

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup Database
    runs-on: ubuntu-latest
    
    steps:
      - name: Backup via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Create backup directory if it doesn't exist
            mkdir -p /var/backups/lamgame
            
            # Set backup filename with timestamp
            BACKUP_DATE=$(date +"%Y%m%d_%H%M%S")
            BACKUP_FILE="/var/backups/lamgame/backup_${BACKUP_DATE}.sql.gz"
            
            # Backup database
            echo "📦 Creating database backup..."
            docker-compose -f /data/www/lamgame.vn/docker-compose.yml exec -T mysql \
              mysqldump -u root -proot lamgame | gzip > $BACKUP_FILE
            
            # Backup storage and uploads
            echo "📦 Creating storage backup..."
            tar -czf "/var/backups/lamgame/storage_${BACKUP_DATE}.tar.gz" \
              -C /data/www/lamgame.vn storage/app/public public/uploads
            
            # Keep only last 7 days of backups
            echo "🗑️ Cleaning old backups..."
            find /var/backups/lamgame -name "backup_*.sql.gz" -mtime +7 -delete
            find /var/backups/lamgame -name "storage_*.tar.gz" -mtime +7 -delete
            
            echo "✅ Backup completed: $BACKUP_FILE"
            
            # Optional: Upload to S3 or other cloud storage
            # aws s3 cp $BACKUP_FILE s3://your-bucket/backups/
