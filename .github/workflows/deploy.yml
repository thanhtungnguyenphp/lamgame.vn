name: CD - Deploy to Production

on:
  workflow_run:
    workflows: ["CI - Test & Build"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            cd /data/www/lamgame.vn

            echo "🔄 Pulling latest code..."
            git pull origin main

            echo "📦 Installing Composer dependencies..."
            docker exec lg-php composer install --no-dev --optimize-autoloader --no-interaction

            echo "📦 Installing NPM & building assets..."
            docker exec lg-php npm ci
            docker exec lg-php npm run build

            echo "🔄 Running migrations..."
            docker exec lg-php php artisan migrate --force

            echo "🧹 Clearing caches..."
            docker exec lg-php php artisan config:clear
            docker exec lg-php php artisan cache:clear
            docker exec lg-php php artisan route:clear
            docker exec lg-php php artisan view:clear

            echo "⚡ Optimizing..."
            docker exec lg-php php artisan config:cache
            docker exec lg-php php artisan route:cache
            docker exec lg-php php artisan view:cache

            echo "🔗 Storage link..."
            docker exec lg-php php artisan storage:link 2>/dev/null || true

            echo "🔄 Restarting PHP-FPM..."
            docker restart lg-php

            echo "✅ Deployment completed!"
