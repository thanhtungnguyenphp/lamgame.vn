name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    container:
      image: php:8.3-fpm
      options: --user root

    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y git unzip libzip-dev libicu-dev libonig-dev \
            libxml2-dev libfreetype6-dev libjpeg62-turbo-dev libpng-dev libcurl4-openssl-dev
          docker-php-ext-configure gd --with-freetype --with-jpeg
          docker-php-ext-install -j$(nproc) gd intl pdo_mysql bcmath zip exif

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          mv composer.phar /usr/local/bin/composer

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cp .env.example .env || touch .env
          composer config --global process-timeout 2000
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          composer run-script post-autoload-dump || true

      - name: Run Pint (Code Style)
        run: |
          if [ -f vendor/bin/pint ]; then
            vendor/bin/pint --test || echo "Pint check failed"
          fi

      - name: Run PHPStan (Static Analysis)
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --memory-limit=2G || echo "PHPStan found issues"
          fi
