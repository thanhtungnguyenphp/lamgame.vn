name: Code Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, zip, bcmath, gd, intl
          coverage: xdebug
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: |
          composer config --global process-timeout 2000
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          composer run-script post-autoload-dump

      - name: Run Pint (Code Style)
        run: |
          if [ -f vendor/bin/pint ]; then
            vendor/bin/pint --test || echo "Pint check failed but continuing..."
          else
            echo "Pint not installed, skipping..."
          fi

      - name: Run PHPStan (Static Analysis)
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --memory-limit=2G || echo "PHPStan found issues but continuing..."
          else
            echo "PHPStan not installed, skipping..."
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Security Checker
        run: |
          composer require --dev enlightn/security-checker || echo "Failed to install security-checker"
          if [ -f vendor/bin/security-checker ]; then
            vendor/bin/security-checker security:check composer.lock || echo "Security issues found"
          fi
