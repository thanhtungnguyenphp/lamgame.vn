name: CD - Docker Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy-docker:
    name: Deploy Docker Container
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            cd /data/www/lamgame.vn

            echo "🔄 Pulling latest code..."
            git pull origin main

            echo "🐳 Rebuilding & restarting containers..."
            docker compose build php
            docker compose up -d

            echo "📦 Installing dependencies..."
            docker exec lg-php composer install --no-dev --optimize-autoloader --no-interaction
            docker exec lg-php npm ci
            docker exec lg-php npm run build

            echo "🔄 Running migrations..."
            docker exec lg-php php artisan migrate --force

            echo "🧹 Clearing & optimizing..."
            docker exec lg-php php artisan optimize:clear
            docker exec lg-php php artisan optimize

            echo "🗑️ Cleaning unused Docker resources..."
            docker system prune -f

            echo "✅ Docker deployment completed!"
