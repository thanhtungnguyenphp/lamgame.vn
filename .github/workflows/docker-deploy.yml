name: CD - Docker Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy-docker:
    name: Deploy Docker Container
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH and Docker
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /data/www/lamgame.vn
            
            echo "🔄 Pulling latest code..."
            git pull origin main
            
            echo "🐳 Pulling latest Docker images..."
            docker-compose pull
            
            echo "🏗️ Building Docker images..."
            docker-compose build --no-cache php
            
            echo "⬇️ Stopping containers..."
            docker-compose down
            
            echo "⬆️ Starting containers..."
            docker-compose up -d
            
            echo "🔄 Running migrations inside container..."
            docker-compose exec -T php php artisan migrate --force
            
            echo "🧹 Clearing caches..."
            docker-compose exec -T php php artisan config:clear
            docker-compose exec -T php php artisan cache:clear
            docker-compose exec -T php php artisan route:clear
            docker-compose exec -T php php artisan view:clear
            
            echo "⚡ Optimizing..."
            docker-compose exec -T php php artisan config:cache
            docker-compose exec -T php php artisan route:cache
            docker-compose exec -T php php artisan view:cache
            
            echo "🔗 Creating storage link..."
            docker-compose exec -T php php artisan storage:link
            
            echo "🗑️ Cleaning up unused Docker resources..."
            docker system prune -f
            
            echo "✅ Docker deployment completed!"
