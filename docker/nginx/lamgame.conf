# www → non-www redirect
server {
    listen 80;
    server_name www.lamgame.vn;
    return 301 https://lamgame.vn$request_uri;
}

# Block port 2083 (cPanel) — SEO Fix: eliminate ~200 duplicate URLs
server {
    listen 2083;
    server_name lamgame.vn lamgame.localhost;
    return 301 https://lamgame.vn$request_uri;
}

server {
    listen 80;
    server_name lamgame.localhost lamgame.vn;
    root /var/www/html/public;

    # Increase max body size for file uploads (AI images, etc.)
    client_max_body_size 100M;
    
    # Security headers handled by Laravel SecureHeaders middleware

    index index.php index.html index.htm;

    charset utf-8;

    # SEO: Redirect index.php URLs to clean URLs
    if ($request_uri ~* "^/index\.php$") {
        return 301 https://$host/;
    }
    if ($request_uri ~* "^/index\.php/(.*)$") {
        return 301 https://$host/$1;
    }

    # SEO: Redirect /index.html directly to homepage (avoid 2-hop chain)
    if ($request_uri = "/index.html") {
        return 301 https://$host/;
    }

    # SEO: Redirect .html URLs to clean URLs (exclude /games/ static files)
    if ($request_uri ~* "^/(?!games/)(.*)\.html$") {
        return 301 https://$host/$1;
    }

    # SEO: X-Robots-Tag noindex for all API endpoints
    # Note: Header is primarily set by Laravel NoIndexApiResponse middleware
    # This nginx rule adds it for static file responses under /api/ (defense-in-depth)
    location /api {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # OHHA AI proxy (WebSocket + REST)
    location /ohha-ai/ {
        proxy_pass http://lg-ohha-ai:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Increase timeouts for large file uploads
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
