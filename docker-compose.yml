version: "3.3"

services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: lg-php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_HOST=lg-mysql
      - DB_PORT=3306
      - DB_DATABASE=lamgame
      - DB_USERNAME=lg
      - DB_PASSWORD=lg
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://meili:7700
      - SCOUT_DRIVER=meilisearch

    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lamgame-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: lg-web
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/lamgame.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    ports:
      - "49171:80"
    networks:
      - lamgame-network
      - traefik-public
      - shared-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.lamgame.rule=Host(`lamgame.vn`) || Host(`lamgame.test`)"
      - "traefik.http.routers.lamgame.entrypoints=web"
      - "traefik.http.routers.lamgame-secure.rule=Host(`lamgame.vn`) || Host(`lamgame.test`)"
      - "traefik.http.routers.lamgame-secure.entrypoints=websecure"
      - "traefik.http.routers.lamgame-secure.tls=true"
      - "traefik.http.services.lamgame.loadbalancer.server.port=80"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: lg-mysql
    environment:
      - MYSQL_DATABASE=lamgame
      - MYSQL_USER=lg
      - MYSQL_PASSWORD=lg
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - lg-mysql-data:/var/lib/mysql
    ports:
      - "33069:3306"
    networks:
      - lamgame-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lg-redis
    ports:
      - "63794:6379"
    networks:
      - lamgame-network
    restart: unless-stopped

  meili:
    image: getmeili/meilisearch:v1.8
    container_name: lg-meili
    ports:
      - "7703:7700"
    networks:
      - lamgame-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.18
    container_name: lg-mailpit
    ports:
      - "55934:1025"
      - "8029:8025"
    networks:
      - lamgame-network
    restart: unless-stopped

  # === II-Agent (AI Tools Backend) ===
  ii-agent-postgres:
    image: postgres:15-alpine
    container_name: lg-ii-postgres
    environment:
      - POSTGRES_USER=iiagent
      - POSTGRES_PASSWORD=iiagent
      - POSTGRES_DB=iiagentdev
    volumes:
      - ii-agent-pg-data:/var/lib/postgresql/data
    networks:
      - lamgame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iiagent -d iiagentdev"]
      interval: 10s
      timeout: 5s
      retries: 5

  ii-agent:
    build:
      context: ./docker/ii-agent
      dockerfile: Dockerfile
    container_name: lg-ii-agent
    depends_on:
      ii-agent-postgres:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL_CONFIGS=[{"model_id":"gpt-4o-mini","provider":"OpenAI","api_key":"${OPENAI_API_KEY}","display_name":"GPT-4o Mini","is_default":true},{"model_id":"gpt-4o","provider":"OpenAI","api_key":"${OPENAI_API_KEY}","display_name":"GPT-4o"},{"model_id":"claude-sonnet-4-6","provider":"Anthropic","api_key":"${ANTHROPIC_API_KEY}","display_name":"Claude Sonnet"}]
      - DATABASE_URL=postgresql+asyncpg://iiagent:iiagent@lg-ii-postgres:5432/iiagentdev
      - REDIS_SESSION_URL=redis://redis:6379/2
      - GUNICORN_WORKERS=1
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_BASE_DIR=/tmp/ii-agent-storage
      - STORAGE_LOCAL_SERVE_URL=http://localhost:8900/storage
      - COMPOSIO_API_KEY=dummy_not_used
    ports:
      - "8900:8000"
    networks:
      - lamgame-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  lamgame-network:
    driver: bridge
  traefik-public:
    external: true
  shared-network:
    external: true

volumes:
  lg-mysql-data:
  ii-agent-pg-data:
