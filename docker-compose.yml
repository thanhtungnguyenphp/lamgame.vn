version: "3.3"

services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: lg-php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=lamgame
      - DB_USERNAME=lg
      - DB_PASSWORD=lg
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://meili:7700
      - SCOUT_DRIVER=meilisearch

    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lamgame-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: lg-web
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/lamgame.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    ports:
      - "49171:80"
    networks:
      - lamgame-network
      - traefik-public
      - shared-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared-network"
      - "traefik.http.routers.lamgame.rule=Host(`lamgame.vn`)"
      - "traefik.http.routers.lamgame.entrypoints=web"
      - "traefik.http.routers.lamgame-secure.rule=Host(`lamgame.vn`)"
      - "traefik.http.routers.lamgame-secure.entrypoints=websecure"
      - "traefik.http.routers.lamgame-secure.tls=true"
      - "traefik.http.services.lamgame.loadbalancer.server.port=80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lg-redis
    ports:
      - "63794:6379"
    networks:
      - lamgame-network
    restart: unless-stopped

  meili:
    image: getmeili/meilisearch:v1.8
    container_name: lg-meili
    ports:
      - "7703:7700"
    networks:
      - lamgame-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.18
    container_name: lg-mailpit
    ports:
      - "49170:1025"
      - "8028:8025"
    networks:
      - lamgame-network
    restart: unless-stopped

networks:
  lamgame-network:
    driver: bridge
  traefik-public:
    external: true
  shared-network:
    external: true

volumes: {}
