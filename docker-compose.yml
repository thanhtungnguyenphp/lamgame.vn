version: "3.3"

services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: lg-php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=lamgame
      - DB_USERNAME=lg
      - DB_PASSWORD=lg
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://meili:7700
      - SCOUT_DRIVER=meilisearch

    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lamgame-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: lg-web
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/lamgame.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    ports:
      - "49171:80"
    networks:
      - lamgame-network
      - traefik-public
      - shared-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared-network"
      - "traefik.http.routers.lamgame.rule=Host(`lamgame.vn`)"
      - "traefik.http.routers.lamgame.entrypoints=web"
      - "traefik.http.routers.lamgame-secure.rule=Host(`lamgame.vn`)"
      - "traefik.http.routers.lamgame-secure.entrypoints=websecure"
      - "traefik.http.routers.lamgame-secure.tls=true"
      # www → non-www redirect middleware
      - "traefik.http.middlewares.lamgame-www-redirect.redirectregex.regex=^https?://www\\.lamgame\\.vn/(.*)"
      - "traefik.http.middlewares.lamgame-www-redirect.redirectregex.replacement=https://lamgame.vn/$${1}"
      - "traefik.http.middlewares.lamgame-www-redirect.redirectregex.permanent=true"
      # www routers
      - "traefik.http.routers.lamgame-www.rule=Host(`www.lamgame.vn`)"
      - "traefik.http.routers.lamgame-www.entrypoints=web"
      - "traefik.http.routers.lamgame-www.middlewares=lamgame-www-redirect"
      - "traefik.http.routers.lamgame-www-secure.rule=Host(`www.lamgame.vn`)"
      - "traefik.http.routers.lamgame-www-secure.entrypoints=websecure"
      - "traefik.http.routers.lamgame-www-secure.tls=true"
      - "traefik.http.routers.lamgame-www-secure.middlewares=lamgame-www-redirect"
      - "traefik.http.services.lamgame.loadbalancer.server.port=80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lg-redis
    ports:
      - "63794:6379"
    networks:
      - lamgame-network
    restart: unless-stopped

  meili:
    image: getmeili/meilisearch:v1.8
    container_name: lg-meili
    ports:
      - "7703:7700"
    networks:
      - lamgame-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.18
    container_name: lg-mailpit
    ports:
      - "49170:1025"
      - "8028:8025"
    networks:
      - lamgame-network
    restart: unless-stopped

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    container_name: lg-soketi
    ports:
      - "6001:6001"
    environment:
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: "lamgame-sport"
      SOKETI_DEFAULT_APP_KEY: "sport-pulse-key"
      SOKETI_DEFAULT_APP_SECRET: "sport-pulse-secret"
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"
    networks:
      - lamgame-network
    restart: unless-stopped

  queue:
    image: lamgamevn_php
    container_name: lg-queue
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=lamgame
      - DB_USERNAME=lg
      - DB_PASSWORD=lg
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "/var/www/html/docker/queue-worker.sh"]
    depends_on:
      - redis
    networks:
      - lamgame-network
    restart: unless-stopped

networks:
  lamgame-network:
    driver: bridge
  traefik-public:
    external: true
  shared-network:
    external: true

volumes: {}
