version: "3.3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lg-web
    ports:
      - "80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/lamgame.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - lamgame-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lamgame.rule=Host(`lamgame.vn`)"
      - "traefik.http.routers.lamgame.entrypoints=web"
      - "traefik.http.services.lamgame.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: lg-php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - PHP_IDE_CONFIG=serverName=lg-php
    depends_on:
      - mysql
      - redis
    networks:
      - lamgame-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: lg-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lamgame
      MYSQL_USER: lg
      MYSQL_PASSWORD: lg
    volumes:
      - lamgame_lg_dbdata:/var/lib/mysql
    ports:
      - "33069:3306"
    networks:
      - lamgame-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lg-redis
    ports:
      - "63794:6379"
    volumes:
      - redis_data:/data
    networks:
      - lamgame-network
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: lg-meili
    environment:
      MEILI_MASTER_KEY: lamgame_meili_master_key
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    ports:
      - "7703:7700"
    networks:
      - lamgame-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.18
    container_name: lg-mailpit
    ports:
      - "8028:8025"
      - "1025"
    networks:
      - lamgame-network
    restart: unless-stopped

volumes:
  lamgame_lg_dbdata:
    external: true
  redis_data:
    driver: local
  meili_data:
    driver: local

networks:
  lamgame-network:
    driver: bridge
  traefik-public:
    external: true
