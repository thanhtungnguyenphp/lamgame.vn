version: "3.3"

services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: lamgame-php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - PHP_IDE_CONFIG=serverName=lamgame-php
      # Database
      - DB_HOST=shared-mysql
      - DB_PORT=3306
      - DB_DATABASE=lamgame
      - DB_USERNAME=lamgame
      - DB_PASSWORD=lamgame
      # Redis
      - REDIS_HOST=shared-redis
      - REDIS_PORT=6379
      # Meilisearch
      - MEILISEARCH_HOST=http://shared-meili:7700
      - SCOUT_DRIVER=meilisearch
      # Mail
      - MAIL_HOST=shared-mailpit
      - MAIL_PORT=1025
    networks:
      - shared-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: lamgame-web
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/lamgame.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - shared-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared-network"
      # HTTP
      - "traefik.http.routers.lamgame.rule=Host(`lamgame.localhost`)"
      - "traefik.http.routers.lamgame.entrypoints=web"
      # HTTPS
      - "traefik.http.routers.lamgame-secure.rule=Host(`lamgame.localhost`)"
      - "traefik.http.routers.lamgame-secure.entrypoints=websecure"
      - "traefik.http.routers.lamgame-secure.tls=true"
      # Service
      - "traefik.http.services.lamgame.loadbalancer.server.port=80"
    restart: unless-stopped

networks:
  shared-network:
    external: true
