    <div class="test-item">
        <h3>Test 3: Different Sizes</h3>
        <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
            <div>
                <p>100px:</p>
                <img src="/assets/logos/png/logo-horizontal-100.png" alt="Logo 100" style="height: 30px;" onerror="this.style.border='2px solid red'" onload="this.style.border='2px solid green'">

                <img src="/assets/logos/png/logo-horizontal-150.png" alt="Logo 150" style="height: 40px;" onerror="this.style.border='2px solid red'" onload="this.style.border='2px solid green'">
            </div>
            <div>
                <p>200px:</p>
                <img src="/assets/logos/png/logo-horizontal-200.png" alt="Logo 200" style="height: 50px;" onerror="this.style.border='2px solid red'" onload="this.style.border='2px solid green'">

    <div class="test-item">
        <h3>Test 4: File Existence Check</h3>
        <div id="fileCheck">Checking files...</div>
    </div>
    
    <div class="test-item">
        <h3>Test 5: Current URL & Path</h3>
        <p><strong>Current URL:</strong> <span id="currentUrl"></span></p>
        <p><strong>Base URL:</strong> <span id="baseUrl"></span></p>
        <p><strong>Full Asset Path:</strong> <span id="fullPath"></span></p>
    </div>
    
    <script>
        // Display current URL info
        document.getElementById('currentUrl').textContent = window.location.href;
        document.getElementById('baseUrl').textContent = window.location.origin;
        document.getElementById('fullPath').textContent = window.location.origin + '/assets/logos/png/logo-horizontal-200.png';
        
        // Check file existence
        async function checkFiles() {
            const files = [
                '/assets/logos/png/logo-horizontal-100.png',
                '/assets/logos/png/logo-horizontal-150.png', 
                '/assets/logos/png/logo-horizontal-200.png',
                '/assets/logos/png/logo-horizontal-300.png',
                '/assets/logos/png/logo-horizontal-400.png'
            ];
            
            let results = '<ul>';
            
            for (let file of files) {
                try {
                    const response = await fetch(file, { method: 'HEAD' });
                    if (response.ok) {
                        results += `<li style="color: green;">✅ ${file} (${response.status})</li>`;
                    } else {
                        results += `<li style="color: red;">❌ ${file} (${response.status})</li>`;
                    }
                } catch (error) {
                    results += `<li style="color: red;">❌ ${file} (Error: ${error.message})</li>`;
                }
            }
            
            results += '</ul>';
            document.getElementById('fileCheck').innerHTML = results;
        }
        
        checkFiles();
        
        // Log console info
        console.log('Logo test page loaded');
        console.log('Current URL:', window.location.href);
        console.log('Testing logo files...');
    </script>
