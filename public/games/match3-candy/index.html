<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Game Match-3 HTML5 với swap, cascade và giới hạn lượt."><title>Kẹo Ngọt Match-3 | LamGame</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p>HTML5 PUZZLE</p><h1>Kẹo Ngọt Match-3</h1></div><a href="https://lamgame.vn">LamGame.vn</a></header><section><div id="board" class="board" role="grid" aria-label="Bàn Match-3"></div><aside><div class="stat"><span>Điểm</span><strong id="score">0</strong></div><div class="stat"><span>Lượt</span><strong id="moves">30</strong></div><div class="stat"><span>Mục tiêu</span><strong>1.500</strong></div><button id="shuffle" type="button">Xáo bàn</button><button id="restart" type="button">Chơi lại</button><h2>Cách chơi</h2><p>Chọn hai viên kẹo liền kề để đổi chỗ. Tạo hàng hoặc cột từ ba viên cùng màu để ghi điểm và kích hoạt cascade.</p></aside></section><p id="status" role="status" aria-live="polite">Chọn một viên kẹo để bắt đầu.</p></main><script src="game.js" defer></script></body></html>
