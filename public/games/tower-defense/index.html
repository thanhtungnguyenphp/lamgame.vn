<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="description" content="Tower Defense HTML5: đặt và nâng cấp tháp để bảo vệ lõi năng lượng.">
    <title>Tower Defense HTML5 | LamGame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
    <header>
        <div><p>HTML5 STRATEGY</p><h1>Neon Tower Defense</h1></div>
        <a href="https://lamgame.vn">LamGame.vn</a>
    </header>
    <section class="layout">
        <canvas id="game" width="960" height="640" aria-label="Bản đồ Tower Defense"></canvas>
        <aside>
            <div class="stats">
                <span>Vàng <strong id="gold">180</strong></span>
                <span>Lõi <strong id="lives">20</strong></span>
                <span>Wave <strong id="wave">0</strong></span>
                <span>Điểm <strong id="score">0</strong></span>
            </div>
            <button id="start-wave" type="button">Bắt đầu wave</button>
            <button id="upgrade" type="button" disabled>Nâng cấp tháp</button>
            <button id="restart" type="button" class="secondary">Chơi lại</button>
            <div class="help">
                <h2>Điều khiển</h2>
                <p>Chạm ô trống để đặt Pulse Tower (50 vàng). Chạm tháp để chọn, sau đó nâng cấp tầm bắn và sát thương.</p>
                <p>Tiêu diệt drone trước khi chúng tới lõi năng lượng.</p>
            </div>
        </aside>
    </section>
    <p id="status" role="status" aria-live="polite">Đặt tháp rồi bắt đầu wave đầu tiên.</p>
</main>
<script src="game.js" defer></script>
</body>
</html>
