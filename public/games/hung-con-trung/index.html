<!DOCTYPE html>
<html lang="vi" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Game hứng côn trùng vui nhộn miễn phí">
    <meta name="keywords" content="hứng côn trùng,insect catch,lamgame">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Hứng Côn Trùng - Chơi Miễn Phí | LamGame</title>
    <meta property="og:title" content="Hứng Côn Trùng - Chơi Miễn Phí | LamGame">
    <meta property="og:description" content="Game hứng côn trùng vui nhộn miễn phí">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lamgame.vn/choi-game/hung-con-trung">




  </head>
  <body>
    <div class="screen">
      <h1>🐛 Hứng Côn Trùng</h1>
      <button class="btn" id="start-btn">Play Game</button>
    </div>
    <div class="screen">
      <h1>🐛 Hứng Côn Trùng</h1>
      <ul class="insects-list">
        <li>
          <button class="choose-insect-btn">
            <p>Fly</p>
            <img
              src="http://pngimg.com/uploads/fly/fly_PNG3946.png"
              alt="fly"
            />
          </button>
        </li>
        <li>
          <button class="choose-insect-btn">
            <p>Mosquito</p>
            <img
              src="http://pngimg.com/uploads/mosquito/mosquito_PNG18175.png"
              alt="mosquito"
            />
          </button>
        </li>
        <li>
          <button class="choose-insect-btn">
            <p>Spider</p>
            <img
              src="http://pngimg.com/uploads/spider/spider_PNG12.png"
              alt="spider"
            />
          </button>
        </li>
        <li>
          <button class="choose-insect-btn">
            <p>Roach</p>
            <img
              src="http://pngimg.com/uploads/roach/roach_PNG12163.png"
              alt="roach"
            />
          </button>
        </li>
      </ul>
    </div>
    <div class="screen game-container" id="game-container">
      <h3 id="time" class="time">Time: 00:00</h3>
      <h3 id="score" class="score">Score: 0</h3>
      <h5 id="message" class="message">
        Are you annnoyed yet? <br />
        You are playing an impossible game!!
      </h5>
    </div>
    <script src="script.js"></script>
  <div style="text-align:center;padding:12px;background:#1A1A2E;color:#E0E0E0;font-size:13px"><a href="https://lamgame.vn" style="color:#FF6B35;text-decoration:none;font-weight:bold">🎮 LamGame</a> — Chơi thêm game miễn phí</div>
</body>
</html>
