<!DOCTYPE html>
<html lang="vi" lang="vi">
  <head>
    <title>Chém Hoa Quả - Chơi Miễn Phí | LamGame</title>
    <meta property="og:title" content="Chém Hoa Quả - Chơi Miễn Phí | LamGame">
    <meta property="og:description" content="Game chém hoa quả Fruit Ninja miễn phí">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lamgame.vn/choi-game/chem-hoa-qua">
    <meta charset="utf-8" />
    <meta name="description" content="Game chém hoa quả Fruit Ninja miễn phí">
    <meta name="keywords" content="fruit ninja,chém hoa quả,lamgame">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.css"
    />


  <script src="/_shared/wrapper.js"></script>
</head>
  <body>
    <div id="container">
      <div id="instructions">
        Slice Fruits
      </div>
      <div id="fruitcontainer">
        <div id="score">
          <div class="scoreDisplay">
            <img
              src="https://raw.githubusercontent.com/Saumya-07/Fruit-Slicer/master/images/scr.png"
              alt=""
            />
            <span id="scoreValue">0</span>
          </div>
        </div>
        <div id="trialsleft"></div>
        <div id="front">
          Are you ready for the ultimate slice action ? <br />
          <img
            src="https://raw.githubusercontent.com/Saumya-07/Fruit-Slicer/master/images/splash.png"
            alt="Fruit logo"
          />
        </div>
        <img id="fruit1" class="fruit" />
      </div>
      <div id="startReset">
        Start Game
      </div>
      <!--for game over block-->
      <div id="gameOver"></div>
    </div>
    <!--for audio files-->
    <audio id="slicesound">
      <source
        src="https://github.com/Saumya-07/Fruit-Slicer/blob/master/audio/slicefruit.mp3"
      />
      <source
        src="https://github.com/Saumya-07/Fruit-Slicer/blob/master/audio/slicefruit.ogg"
      />
      <source
        src="https://github.com/Saumya-07/Fruit-Slicer/blob/master/audio/slicefruit.wav"
      />
    </audio>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.4/jquery-ui.min.js"></script>
    <script src="script.js"></script>
  <div style="text-align:center;padding:12px;background:#1A1A2E;color:#E0E0E0;font-size:13px"><a href="https://lamgame.vn" style="color:#FF6B35;text-decoration:none;font-weight:bold">🎮 LamGame</a> — Chơi thêm game miễn phí</div>
</body>
</html>
