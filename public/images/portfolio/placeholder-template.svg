<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a40" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect fill="url(#bg)" width="800" height="450"/>
  <rect fill="url(#grid)" width="800" height="450" opacity="0.3"/>
  <rect x="50" y="50" width="700" height="350" rx="12" fill="#0d0d1a" stroke="#8B5CF6" stroke-width="2"/>
  <text x="400" y="200" fill="#8B5CF6" font-size="60" text-anchor="middle" font-family="system-ui">🎮</text>
  <text x="400" y="280" fill="#F0F0F5" font-size="28" text-anchor="middle" font-family="system-ui" font-weight="600">Project Screenshot</text>
  <text x="400" y="320" fill="#8B8BA3" font-size="16" text-anchor="middle" font-family="system-ui">Replace with actual game screenshot</text>
</svg>
